name: Nix package

on:
  workflow_dispatch:
  push:
    branches:
      - integration/nixos-hermes
    paths:
      - flake.nix
      - flake.lock
      - nix/**
      - package.json
      - package-lock.json
      - sidecar/**
      - bin/**
      - .github/workflows/nix-package.yml
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - nix/**
      - package.json
      - package-lock.json
      - sidecar/**
      - bin/**
      - .github/workflows/nix-package.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Flake metadata
        run: nix flake metadata
      - name: Build StarNet
        run: nix build .#starnet -L
