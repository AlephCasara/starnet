name: Nix package

on:
  workflow_dispatch:
  push:
    branches:
      - integration/nixos-hermes
    paths:
      - flake.nix
      - flake.lock
      - nix/**
      - package.json
      - package-lock.json
      - sidecar/**
      - bin/**
      - .github/workflows/nix-package.yml
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - nix/**
      - package.json
      - package-lock.json
      - sidecar/**
      - bin/**
      - .github/workflows/nix-package.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Flake metadata
        run: nix flake metadata
      - name: Flake checks
        run: nix flake check -L
      - name: Build StarNet
        run: nix build .#starnet -L
      - name: Sidecar smoke test
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/starnet-sidecar.log"
          ./result/bin/starnet-server >"$log" 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/api/health >"$RUNNER_TEMP/starnet-health.json"; then
              cat "$RUNNER_TEMP/starnet-health.json"
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$log" >&2
              exit 1
            fi
            sleep 0.5
          done

          cat "$log" >&2
          echo "StarNet did not become healthy on 127.0.0.1:8787" >&2
          exit 1
